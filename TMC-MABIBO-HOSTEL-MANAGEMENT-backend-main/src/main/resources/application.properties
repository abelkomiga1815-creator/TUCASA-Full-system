spring.application.name=tucasa-mabibo-backend

# ------------------------------------------------------------------
# Server
# ------------------------------------------------------------------
server.port=${PORT:${SERVER_PORT:8080}}

# ------------------------------------------------------------------
# Datasource (PostgreSQL 16)
# ------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tucasa_mabibo}
spring.datasource.username=${DB_USERNAME:tucasa_user}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

# ------------------------------------------------------------------
# JPA / Hibernate
# ------------------------------------------------------------------
# Flyway owns the schema; Hibernate must never auto-generate DDL.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# ------------------------------------------------------------------
# Flyway
# ------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# ------------------------------------------------------------------
# JWT
# ------------------------------------------------------------------
# 512-bit base64 secret - replace via env var in every real deployment.
app.jwt.secret=${JWT_SECRET:ZmFrZS1kZXYtb25seS1zZWNyZXQtcmVwbGFjZS1pbi1wcm9kLTEyMzQ1Njc4OTBhYmNkZWZnaGlqa2xtbm9wcXJzdHV2d3h5eg==}
app.jwt.access-token-expiration-ms=${JWT_ACCESS_EXP_MS:3600000}
app.jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXP_MS:1209600000}
app.jwt.issuer=tucasa-mabibo-backend

# ------------------------------------------------------------------
# CORS
# ------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ------------------------------------------------------------------
# Business rules
# ------------------------------------------------------------------
app.branch.default-name=UDSM Mabibo Hostel

# ------------------------------------------------------------------
# Mail (mock/dev - point at MailHog or similar locally)
# ------------------------------------------------------------------
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
app.mail.enabled=${MAIL_ENABLED:false}

# ------------------------------------------------------------------
# Jackson
# ------------------------------------------------------------------
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ------------------------------------------------------------------
# Logging
# ------------------------------------------------------------------
logging.level.com.tucasa.mabibo=${LOG_LEVEL:INFO}
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:WARN}

# ------------------------------------------------------------------
# Multipart (profile pics)
# ------------------------------------------------------------------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ------------------------------------------------------------------
# SMS Configuration (mock by default)
# ------------------------------------------------------------------
app.sms.mock-enabled=true

# ------------------------------------------------------------------
# File Storage (profile pictures)
# ------------------------------------------------------------------
app.storage.profiles-dir=${PROFILES_DIR:uploads/profiles}
app.storage.profile-pic.max-size-mb=2
# Profile pictures must be JPEG images only (.jpg and .jpeg both use the
# image/jpeg MIME type). app.storage.profile-pic.allowed-types is enforced
# against the declared MIME type; the decoded content format is checked
# separately in FileStorageService so a mislabelled non-JPEG cannot slip through.
app.storage.profile-pic.allowed-types=image/jpeg,image/jpg
app.storage.profile-pic.target-ratio=1:1
